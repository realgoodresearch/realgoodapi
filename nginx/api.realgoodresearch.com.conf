# /etc/nginx/sites-available/api.realgoodresearch.com
# Production HTTPS configuration with WireGuard reverse proxy

# Connection header mapping for WebSocket proxying support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server - Redirects all plaintext HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.realgoodresearch.com;

    # Allow Let's Encrypt renewal challenges through HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - SSL Termination & WireGuard Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.realgoodresearch.com;

    # Local address of Serenity, reached through WireGuard
    set $serenity_ip 192.168.50.5;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.realgoodresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.realgoodresearch.com/privkey.pem;

    # SSL hardening protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Optional Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Max upload size (adjust according to your API payload needs)
    client_max_body_size 20M;

    # Preserve the complete SocialWatcher path when forwarding to Flask.
    # /socialwatcher/... remains /socialwatcher/... on the backend.
    location = /socialwatcher {
        return 301 /socialwatcher/;
    }

    location /socialwatcher/ {
        proxy_pass http://$serenity_ip:8000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Lightsail is the public edge, so discard any client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts and Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Backend readiness: succeeds only when the API is reachable through WireGuard
    # and exposes its own /healthz endpoint.
    location = /healthz {
        access_log off;
        proxy_pass http://$serenity_ip:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Proxy liveness: confirms that Nginx itself is serving requests.
    location = /livez {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
