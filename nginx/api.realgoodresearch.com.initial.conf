# /etc/nginx/sites-available/api.realgoodresearch.com
# Temporary bootstrap configuration for Let's Encrypt challenge verification
# Enable this first, run certbot, then switch to the full HTTPS configuration.

server {
    listen 80;
    listen [::]:80;
    server_name api.realgoodresearch.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Fallback response prior to SSL issuance
    location / {
        return 200 "Bootstrap mode: Awaiting SSL certificate generation.\n";
        add_header Content-Type text/plain;
    }
}
