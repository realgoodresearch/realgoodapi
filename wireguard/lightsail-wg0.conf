# /etc/wireguard/wg0.conf (AWS Lightsail client)
# Permissions should be set to 600: sudo chmod 600 /etc/wireguard/wg0.conf

[Interface]
# VPN address assigned to Lightsail by the existing WireGuard server
Address = <REPLACE_WITH_LIGHTSAIL_VPN_ADDRESS>

# Private key of the Lightsail instance (generated on Lightsail)
PrivateKey = <REPLACE_WITH_LIGHTSAIL_PRIVATE_KEY>

# Do not automatically overwrite this file on shutdown
SaveConfig = false

# Existing WireGuard VPN server
[Peer]
PublicKey = <REPLACE_WITH_VPN_SERVER_PUBLIC_KEY>
PresharedKey = <REPLACE_WITH_LIGHTSAIL_PRESHARED_KEY>
Endpoint = <REPLACE_WITH_VPN_SERVER_ENDPOINT>:51820

# Route only Serenity through the VPN
AllowedIPs = 192.168.50.5/32
PersistentKeepalive = 25
